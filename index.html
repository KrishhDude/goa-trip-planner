<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9eee9">
  <meta name="description" content="Confirmed train details and sleeper berths for the Goa trip.">
  <title>GOAAA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #202a25;
      --muted: #707a73;
      --paper: #e9eee9;
      --panel: rgba(255, 255, 252, .76);
      --line: rgba(37, 54, 44, .12);
      --green: #33745c;
      --green-dark: #245742;
      --green-pale: #dcece2;
      --coral: #c7674d;
      --amber: #d9a94e;
      --blue: #87b5bd;
      --lavender: #aca0c5;
      --sans: "Manrope", "Segoe UI", sans-serif;
      --mono: "DM Mono", monospace;
    }
    * { box-sizing: border-box; }
    body { isolation: isolate; margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
    .page-backdrop { position: fixed; z-index: 0; inset: 0; overflow: hidden; pointer-events: none; }
    .page-backdrop::before { content: ""; position: absolute; inset: 0; background: url("goa-beach.png") center 51% / cover no-repeat; transform: scale(1.08, -1.08) translate(-3%, -4%); }
    .page-backdrop::after { content: ""; position: absolute; inset: 0; background: rgba(239, 243, 238, .16); }
    .topbar, main, footer { position: relative; z-index: 1; }
    button { color: inherit; font: inherit; }
    .shell { width: min(1160px, calc(100% - 52px)); margin: 0 auto; }
    .topbar { height: 72px; display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding: 0 18px; border: 1px solid rgba(255,255,255,.48); border-radius: 14px; background: rgba(239,247,241,.32); box-shadow: 0 8px 30px rgba(20,38,29,.1), inset 0 1px 0 rgba(255,255,255,.62); backdrop-filter: blur(24px) saturate(155%); -webkit-backdrop-filter: blur(24px) saturate(155%); }
    .brand { display: flex; align-items: center; gap: 10px; color: #d6d6d6; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-shadow: 0 1px 4px rgba(17,38,27,.5); text-transform: uppercase; }
    .brand-mark { display: grid; width: 32px; height: 32px; place-items: center; border-radius: 50%; background: var(--green-dark); color: white; font-size: 13px; }
    .trip-date { color: #fff; font-size: 12px; font-weight: 600; text-shadow: 0 1px 4px rgba(17,38,27,.5); }
    main { padding: 30px 0 66px; }
    .section-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: min(480px, 100%); margin: 0 auto 22px; padding: 4px; border: 1px solid rgba(255,255,255,.62); border-radius: 8px; background: rgba(239,247,241,.48); box-shadow: 0 8px 24px rgba(20,38,29,.08); backdrop-filter: blur(16px) saturate(145%); -webkit-backdrop-filter: blur(16px) saturate(145%); }
    .section-tabs button { min-height: 40px; border: 0; border-radius: 5px; background: transparent; color: #44554a; cursor: pointer; font-size: 12px; font-weight: 800; transition: background .18s, color .18s, box-shadow .18s; }
    .section-tabs button:hover { background: rgba(255,255,255,.42); }
    .section-tabs button[aria-selected="true"] { background: rgba(255,255,255,.86); color: var(--green-dark); box-shadow: 0 2px 8px rgba(32,42,37,.1); }
    .section-tabs button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    .tab-panel[hidden] { display: none; }
    .placeholder-panel { min-height: 190px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.8); border-radius: 8px; background: var(--panel); box-shadow: 0 14px 44px rgba(37,54,44,.065); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .placeholder-panel p { margin: 0; color: #45574b; font-size: 15px; font-weight: 700; }
    .people-count { flex: 0 0 auto; padding: 10px 13px; border: 1px solid var(--line); border-radius: 5px; background: rgba(255,255,255,.45); color: var(--green-dark); font-size: 11px; font-weight: 800; }
    .trip-panel { overflow: hidden; border: 1px solid rgba(255,255,255,.8); border-radius: 8px; background: var(--panel); box-shadow: 0 14px 44px rgba(37, 54, 44, .065); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .trip-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px 22px; border-bottom: 1px solid var(--line); }
    .trip-tabs { display: flex; gap: 5px; padding: 4px; border-radius: 6px; background: rgba(39, 59, 47, .07); }
    .trip-tabs button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 800; transition: color .2s, background .2s, transform .2s; }
    .trip-tabs button:hover { color: var(--ink); }
    .trip-tabs button[aria-pressed="true"] { background: white; color: var(--green-dark); box-shadow: 0 1px 5px rgba(32, 42, 37, .09); }
    .direction { color: var(--muted); font-size: 11px; font-weight: 700; }
    .train-summary { display: grid; grid-template-columns: 1.3fr 1fr 1fr auto; align-items: center; gap: 20px; padding: 23px 22px 25px; }
    .train-name { margin: 0; font-size: 16px; font-weight: 800; }
    .train-code { margin-left: 7px; color: var(--muted); font: 11px var(--mono); }
    .train-sub { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .time-block { display: flex; align-items: center; gap: 13px; }
    .time-point strong { display: block; font: 700 19px var(--mono); letter-spacing: 0; }
    .time-point span { color: var(--muted); font-size: 10px; }
    .journey-connector { width: 43px; height: 1px; position: relative; background: #bdc9c0; }
    .journey-connector::after { content: ""; position: absolute; top: -3px; right: 0; width: 7px; height: 7px; border-top: 1px solid #8c9a8f; border-right: 1px solid #8c9a8f; transform: rotate(45deg); }
    .duration { color: var(--muted); font-size: 10px; text-align: center; }
    .coach-chip { justify-self: end; padding: 8px 11px; border: 1px solid rgba(51,116,92,.2); border-radius: 4px; background: rgba(220,236,226,.7); color: var(--green-dark); font: 11px var(--mono); }
    .traveler-section { padding: 21px 22px 22px; border-top: 1px solid var(--line); }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .section-head h2 { margin: 0; font-size: 12px; font-weight: 800; }
    .section-head span { color: var(--muted); font-size: 10px; }
    .traveler-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
    .traveler { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 47px; padding: 8px 10px; border: 1px solid rgba(37,54,44,.1); border-radius: 4px; background: rgba(255,255,255,.55); }
    .traveler-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 700; }
    .traveler-seat { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; color: var(--green-dark); font: 10px var(--mono); font-weight: 500; }
    .berth-dot { width: 8px; height: 8px; border-radius: 2px; background: #a8b3ab; }
    .details-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 22px 17px; }
    .details-toggle, .visual-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; background: rgba(255,255,255,.5); cursor: pointer; font-size: 11px; font-weight: 800; transition: background .18s, border-color .18s, transform .18s; }
    .details-toggle:hover, .visual-toggle:hover { border-color: rgba(51,116,92,.4); background: white; }
    button:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
    .chevron { display: inline-block; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translateY(-2px); transition: transform .2s; }
    .details-toggle[aria-expanded="true"] .chevron { transform: rotate(225deg) translate(-1px, -1px); }
    .detail-panel { padding: 0 22px 18px; animation: unfold .25s ease both; }
    @keyframes unfold { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    .pnr-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .pnr-item { padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: rgba(255,255,255,.48); }
    .pnr-label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .pnr-number { font: 11px var(--mono); }
    .visual-toggle { min-height: 41px; padding: 0 15px; border-color: var(--green-dark); background: var(--green-dark); color: white; }
    .visual-toggle:hover { border-color: var(--green); background: var(--green); color: white; }
    .visual-toggle svg { width: 15px; height: 15px; }
    .visual-section { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .5s cubic-bezier(.2,.75,.25,1), opacity .3s ease; }
    .visual-section.is-open { grid-template-rows: 1fr; opacity: 1; }
    .visual-clip { overflow: hidden; min-height: 0; }
    .visual-content { padding-top: 6px; }
    .map-head { display: flex; justify-content: space-between; align-items: end; gap: 14px; margin: 28px 0 13px; }
    .map-head h2 { margin: 0; font-size: 18px; }
    .map-head p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .legend { display: flex; flex-wrap: wrap; justify-content: end; gap: 10px; color: var(--muted); font-size: 9px; }
    .coach-shell { padding: 14px; border: 1px solid rgba(255,255,255,.85); border-radius: 8px; background: rgba(255,255,252,.65); box-shadow: 0 12px 36px rgba(37,54,44,.045); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .coach-doors { max-width: 690px; display: flex; justify-content: space-between; margin: 0 auto 7px; color: #727e75; font-size: 8px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
    .coach { max-width: 690px; margin: 0 auto; padding: 9px; border: 1px solid #aebbb1; border-radius: 23px; background: rgba(248,250,246,.85); }
    .coach-bays { display: grid; grid-template-columns: 1fr; gap: 6px; }
    .bay-row { display: grid; grid-template-columns: minmax(0, 1fr) 7px minmax(132px, .42fr); gap: 5px; align-items: stretch; }
    .bay { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(30px, auto)); gap: 3px; padding: 3px; border: 1px solid rgba(37,54,44,.14); border-radius: 5px; background: rgba(255,255,255,.5); }
    .berth { position: relative; min-width: 0; min-height: 30px; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: 1fr auto; align-content: center; align-items: center; justify-items: center; gap: 0 3px; padding: 2px 7px; border: 1px solid rgba(35,48,39,.12); border-radius: 3px; background: #e2e7e2; color: #34453a; font: 10px var(--mono); transition: transform .18s, box-shadow .18s, filter .18s; }
    .berth.lower, .berth.middle, .berth.upper, .berth.side-lower, .berth.side-upper { background: #e2e7e2; }
    .berth-kind { color: #68766c; font-size: 8px; font-weight: 700; }
    .side-walkway { border-left: 1px dashed #aebbb1; }
    .side-pair { display: grid; grid-template-rows: repeat(2, minmax(30px, auto)); gap: 3px; padding: 3px; border: 1px solid rgba(37,54,44,.14); border-radius: 5px; background: rgba(255,255,255,.5); }
    .coach-seam { position: relative; display: flex; align-items: center; gap: 10px; min-height: 22px; padding: 0 8px; color: #77847a; font: 8px var(--mono); }
    .coach-seam::before, .coach-seam::after { content: ""; flex: 1; border-top: 1px dashed #aebbb1; }
    .berth.is-occupied { z-index: 1; border: 2px solid #65766a; box-shadow: 0 0 0 2px white, 0 4px 12px rgba(41,55,45,.2); transform: translateY(-2px) scale(1.045); color: #202a25; font-weight: 700; }
    .berth-owner { grid-column: 1 / -1; max-width: 100%; overflow: hidden; color: #415248; font: 700 7px var(--sans); text-overflow: ellipsis; white-space: nowrap; }
    .gangway { position: relative; display: flex; align-items: center; justify-content: center; border-left: 1px dashed #c5cdc5; border-right: 1px dashed #c5cdc5; color: #9ba69d; font-size: 8px; writing-mode: vertical-rl; }
    .coach-end { max-width: 690px; display: flex; justify-content: space-between; margin: 8px auto 0; color: #8a968c; font-size: 8px; }
    .map-footnote { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; color: #d3dbd4; font-size: 9px; text-shadow: 0 1px 3px rgba(24,38,29,.68); }
    .map-footnote strong { color: #e5ebe6; }
    footer { padding: 0 20px 27px; color: var(--muted); text-align: center; font-size: 10px; }
    [hidden] { display: none !important; }
    @media (max-width: 720px) {
      .shell { width: min(100% - 30px, 560px); }
      .topbar { height: 60px; padding-inline: 11px; }
      main { padding: 30px 0 45px; }
      .section-tabs { margin-bottom: 16px; }
      .trip-toolbar { padding: 13px; }
      .trip-tabs { gap: 2px; }
      .trip-tabs button { padding: 0 9px; font-size: 10px; }
      .direction { max-width: 95px; text-align: right; font-size: 9px; }
      .train-summary { grid-template-columns: 1fr auto; gap: 15px 8px; padding: 18px 15px; }
      .train-info { grid-column: 1 / -1; }
      .time-block { grid-column: 1; }
      .duration { display: none; }
      .coach-chip { grid-column: 2; grid-row: 2; }
      .traveler-section { padding: 17px 14px; }
      .traveler-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .traveler { padding: 7px; }
      .traveler-name { font-size: 10px; }
      .details-row { padding: 0 14px 14px; }
      .detail-panel { padding: 0 14px 14px; }
      .pnr-grid { grid-template-columns: 1fr; }
      .map-head { align-items: start; flex-direction: column; }
      .legend { justify-content: start; }
      .coach-shell { padding: 8px 5px; }
      .coach { padding: 6px; border-radius: 17px; }
      .bay-row { grid-template-columns: minmax(0, 1fr) 5px minmax(92px, .42fr); gap: 3px; }
      .coach-bays { gap: 4px; }
      .bay { gap: 2px; padding: 2px; }
      .berth, .side-pair { min-height: 27px; font-size: 9px; }
      .berth-kind { font-size: 7px; }
      .berth-owner { font-size: 6px; }
      .side-pair { grid-template-rows: repeat(2, minmax(27px, auto)); gap: 2px; }
    }
    @media (max-width: 380px) {
      .shell { width: calc(100% - 22px); }
      .trip-tabs button { padding-inline: 6px; }
      .traveler-list { grid-template-columns: 1fr 1fr; }
      .bay-row { grid-template-columns: minmax(0, 1fr) 4px minmax(78px, .42fr); }
      .berth, .side-pair { min-height: 24px; font-size: 8px; }
      .berth { padding-inline: 5px; }
      .berth-owner { font-size: 5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page-backdrop" aria-hidden="true"></div>
  <header class="topbar shell">
    <div class="brand">GOAAAAA</div>
    <span class="trip-date">02 — 06 December</span>
  </header>
  <main class="shell">
    <nav class="section-tabs" role="tablist" aria-label="Trip sections">
      <button type="button" role="tab" id="tab-train" aria-selected="true" aria-controls="panel-train" tabindex="0">Train</button>
      <button type="button" role="tab" id="tab-stay" aria-selected="false" aria-controls="panel-stay" tabindex="-1">Stay</button>
      <button type="button" role="tab" id="tab-itinerary" aria-selected="false" aria-controls="panel-itinerary" tabindex="-1">Itinerary</button>
    </nav>

    <section class="tab-panel" id="panel-train" role="tabpanel" aria-labelledby="tab-train">
    <section class="trip-panel" aria-label="Confirmed train bookings">
      <div class="trip-toolbar">
        <div class="trip-tabs" role="group" aria-label="Choose train journey">
          <button type="button" data-journey="outbound" aria-pressed="true">To Goa</button>
          <button type="button" data-journey="return" aria-pressed="false">Back home</button>
        </div>
        <span class="direction" id="journey-direction">Ernakulam → Madgaon</span>
      </div>
      <div class="train-summary" id="train-summary"></div>
      <section class="traveler-section" aria-labelledby="traveler-title">
        <div class="section-head"><h2 id="traveler-title">Your group</h2><span>Coach and berth</span></div>
        <div class="traveler-list" id="traveler-list"></div>
      </section>
      <div class="details-row">
        <button class="details-toggle" id="details-toggle" type="button" aria-expanded="false" aria-controls="booking-details">Booking details <span class="chevron" aria-hidden="true"></span></button>
        <button class="visual-toggle" id="visual-toggle" type="button" aria-expanded="false" aria-controls="visual-section">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 9h4v6H7zM15 9h2M15 12h2M15 15h2M7 19v2M17 19v2"></path></svg>
          Visualise seating
        </button>
      </div>
      <section class="detail-panel" id="booking-details" hidden aria-label="PNR booking references"></section>
    </section>

    <section class="visual-section" id="visual-section" aria-label="Sleeper carriage seating plan" aria-hidden="true">
      <div class="visual-clip"><div class="visual-content">
        <div class="coach-shell"><div class="coach-doors"><span>Coach entry / exit</span><span>Coach entry / exit</span></div><div class="coach"><div class="coach-bays" id="coach-bays"></div></div><div class="coach-end"><span>Coach entry / exit</span><span>Coach entry / exit</span></div></div>
        <div class="map-footnote"><span><strong id="highlight-count">9 berths highlighted</strong> · Your group is outlined.</span><span>Coach <strong id="coach-label">S5</strong></span></div>
      </div></div>
    </section>
    </section>

    <section class="tab-panel placeholder-panel" id="panel-stay" role="tabpanel" aria-labelledby="tab-stay" hidden>
      <p>To be confirmed</p>
    </section>
    <section class="tab-panel placeholder-panel" id="panel-itinerary" role="tabpanel" aria-labelledby="tab-itinerary" hidden>
      <p>To be confirmed</p>
    </section>
  </main>
  <script>
    const journeys = {
      outbound: {
        direction: "Ernakulam → Madgaon",
        train: "ERS LTT Duronto",
        number: "12224",
        date: "Wednesday, 02 December",
        fromTime: "21:30",
        fromStation: "Ernakulam",
        toTime: "08:40",
        toStation: "Madgaon · Thu 03 Dec",
        duration: "11h 10m",
        coach: "S5",
        passengers: [
          { name: "Kp", seat: 54, pnr: "4559062054" },
          { name: "Kashi", seat: 49, pnr: "4559062054" },
          { name: "Badu", seat: 57, pnr: "4559062102" },
          { name: "Vaishnav", seat: 58, pnr: "4559062102" },
          { name: "Emmanuel", seat: 60, pnr: "4559062102" },
          { name: "Alen", seat: 61, pnr: "4559062102" },
          { name: "Aleena", seat: 59, pnr: "4559062102" },
          { name: "Minnu", seat: 62, pnr: "4559062102" },
          { name: "Avani", seat: 50, pnr: "4146883101" }
        ]
      },
      return: {
        direction: "Madgaon → Ernakulam",
        train: "NZM TVC SF Exp",
        number: "22634",
        date: "Sunday, 06 December",
        fromTime: "02:10",
        fromStation: "Madgaon",
        toTime: "14:45",
        toStation: "Ernakulam",
        duration: "12h 35m",
        coach: "S1",
        passengers: [
          { name: "Kp", seat: 51, pnr: "2527373792" },
          { name: "Kashi", seat: 49, pnr: "2527373792" },
          { name: "Badu", seat: 48, pnr: "2465462327" },
          { name: "Vaishnav", seat: 40, pnr: "2465462327" },
          { name: "Emmanuel", seat: 14, pnr: "2465462327" },
          { name: "Alen", seat: 16, pnr: "2465462327" },
          { name: "Aleena", seat: 50, pnr: "2465462327" },
          { name: "Minnu", seat: 52, pnr: "2465462327" },
          { name: "Avani", seat: 18, pnr: "2527382371" }
        ]
      }
    };

    const berthTypes = {};
    const berthLabels = { lower: "L", middle: "M", upper: "U", "side-lower": "SL", "side-upper": "SU" };
    for (let base = 1; base <= 73; base += 8) {
      berthTypes[base] = "lower";
      berthTypes[base + 1] = "middle";
      berthTypes[base + 2] = "upper";
      berthTypes[base + 3] = "lower";
      berthTypes[base + 4] = "middle";
      berthTypes[base + 5] = "upper";
      berthTypes[base + 6] = "side-lower";
      berthTypes[base + 7] = "side-upper";
    }

    const travelerList = document.querySelector("#traveler-list");
    const summary = document.querySelector("#train-summary");
    const details = document.querySelector("#booking-details");
    const detailsToggle = document.querySelector("#details-toggle");
    const visualToggle = document.querySelector("#visual-toggle");
    const visualSection = document.querySelector("#visual-section");
    const sectionTabs = Array.from(document.querySelectorAll('[role="tab"]'));
    const sectionPanels = sectionTabs.map((tab) => document.querySelector(`#${tab.getAttribute("aria-controls")}`));
    let activeJourney = "outbound";

    function selectSection(index, moveFocus = false) {
      sectionTabs.forEach((tab, tabIndex) => {
        const selected = tabIndex === index;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
        sectionPanels[tabIndex].hidden = !selected;
      });
      if (moveFocus) sectionTabs[index].focus();
    }

    sectionTabs.forEach((tab, index) => {
      tab.addEventListener("click", () => selectSection(index));
      tab.addEventListener("keydown", (event) => {
        let nextIndex = index;
        if (event.key === "ArrowRight") nextIndex = (index + 1) % sectionTabs.length;
        else if (event.key === "ArrowLeft") nextIndex = (index - 1 + sectionTabs.length) % sectionTabs.length;
        else if (event.key === "Home") nextIndex = 0;
        else if (event.key === "End") nextIndex = sectionTabs.length - 1;
        else return;
        event.preventDefault();
        selectSection(nextIndex, true);
      });
    });

    function renderJourney(key) {
      activeJourney = key;
      const journey = journeys[key];
      document.querySelectorAll("[data-journey]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.journey === key));
      });
      document.querySelector("#journey-direction").textContent = journey.direction;
      summary.innerHTML = `
        <div class="train-info"><p class="train-name">${journey.train}<span class="train-code">${journey.number}</span></p><p class="train-sub">${journey.date} · Sleeper class</p></div>
        <div class="time-block"><div class="time-point"><strong>${journey.fromTime}</strong><span>${journey.fromStation}</span></div><span class="journey-connector" aria-hidden="true"></span><div class="time-point"><strong>${journey.toTime}</strong><span>${journey.toStation}</span></div></div>
        <span class="duration">${journey.duration}</span><span class="coach-chip">COACH ${journey.coach}</span>`;
      travelerList.innerHTML = [...journey.passengers].sort((first, second) => first.seat - second.seat).map((passenger) => `
        <div class="traveler"><span class="traveler-name">${passenger.name}</span><span class="traveler-seat"><i class="berth-dot ${berthTypes[passenger.seat]}"></i>${journey.coach} · ${passenger.seat}</span></div>`).join("");
      const pnrGroups = new Map();
      journey.passengers.forEach((passenger) => {
        if (!pnrGroups.has(passenger.pnr)) pnrGroups.set(passenger.pnr, []);
        pnrGroups.get(passenger.pnr).push(passenger.name);
      });
      details.innerHTML = `<div class="pnr-grid">${Array.from(pnrGroups, ([pnr, names]) => `
        <div class="pnr-item"><span class="pnr-label">${names.join(", ")}</span><span class="pnr-number">PNR · ${pnr}</span></div>`).join("")}</div>`;
      document.querySelector("#coach-label").textContent = journey.coach;
      document.querySelector("#highlight-count").textContent = `${journey.passengers.length} berths highlighted`;
      renderCoach(journey);
    }

    function renderCoach(journey) {
      const occupied = new Map(journey.passengers.map((passenger) => [passenger.seat, passenger.name]));
      const groups = [];
      for (let base = 1; base <= 73; base += 8) {
        const seats = Array.from({ length: 8 }, (_, index) => base + index);
        groups.push({ base, seats, occupied: seats.some((seat) => occupied.has(seat)) });
      }
      const firstOccupied = groups.findIndex((group) => group.occupied);
      const lastOccupied = groups.findLastIndex((group) => group.occupied);
      const coachRows = [];
      for (let index = firstOccupied; index <= lastOccupied; index += 1) {
        const group = groups[index];
        if (!group.occupied) {
          let end = index;
          while (end + 1 <= lastOccupied && !groups[end + 1].occupied) end += 1;
          coachRows.push(`<div class="coach-seam">Berths ${group.base}–${groups[end].base + 7} folded</div>`);
          index = end;
          continue;
        }
        const mainSeats = group.seats.slice(0, 6);
        const sideSeats = group.seats.slice(6);
        coachRows.push(`<div class="bay-row"><div class="bay">${mainSeats.map((seat) => berthMarkup(seat, occupied)).join("")}</div><div class="side-walkway" aria-hidden="true"></div><div class="side-pair">${sideSeats.map((seat) => berthMarkup(seat, occupied)).join("")}</div></div>`);
      }
      const leadingFolded = groups.slice(0, firstOccupied);
      if (leadingFolded.length) coachRows.unshift(`<div class="coach-seam">Berths 1–${leadingFolded.at(-1).base + 7} folded</div>`);
      const trailingFolded = groups.slice(lastOccupied + 1);
      if (trailingFolded.length) coachRows.push(`<div class="coach-seam">Berths ${trailingFolded[0].base}–80 folded</div>`);
      document.querySelector("#coach-bays").innerHTML = coachRows.join("");
    }

    function berthMarkup(seat, occupied) {
      const owner = occupied.get(seat);
      const kind = berthLabels[berthTypes[seat]];
      return `<div class="berth ${berthTypes[seat]}${owner ? " is-occupied" : ""}"${owner ? ` aria-label="Berth ${seat}, ${kind}, ${owner}"` : ` aria-label="Berth ${seat}, ${kind}"`}><span>${seat}</span><span class="berth-kind">${kind}</span>${owner ? `<span class="berth-owner">${owner}</span>` : ""}</div>`;
    }

    document.querySelectorAll("[data-journey]").forEach((button) => {
      button.addEventListener("click", () => renderJourney(button.dataset.journey));
    });
    detailsToggle.addEventListener("click", () => {
      const expanded = detailsToggle.getAttribute("aria-expanded") !== "true";
      detailsToggle.setAttribute("aria-expanded", String(expanded));
      details.hidden = !expanded;
    });
    visualToggle.addEventListener("click", () => {
      const expanded = visualToggle.getAttribute("aria-expanded") !== "true";
      visualToggle.setAttribute("aria-expanded", String(expanded));
      visualToggle.innerHTML = `${expanded ? "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 7h16M4 12h16M4 17h16\"></path><path d=\"m8 4-4 3 4 3\"></path></svg>Hide seating" : "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"></rect><path d=\"M7 9h4v6H7zM15 9h2M15 12h2M15 15h2M7 19v2M17 19v2\"></path></svg>Visualise seating"}`;
      visualSection.classList.toggle("is-open", expanded);
      visualSection.setAttribute("aria-hidden", String(!expanded));
      if (expanded) visualSection.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    renderJourney(activeJourney);
  </script>
</body>
</html>
